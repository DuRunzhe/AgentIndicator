# git-cliff 配置（中文）：从 Conventional Commits 与版本标签生成 CHANGELOG.md。
#
#   bash scripts/update-changelog.sh 0.2.31
#
# 分组遵循 Keep a Changelog。只负责版本号变更的 build/chore 提交（如
# “build: release” 与 “chore: fill the Homebrew sha256”）不进日志。
#
# 其他语言见同目录 cliff.<lang>.toml（英文为 cliff.en.toml）；新增语言时复制
# 本文件并翻译 header 与分组标题即可。

[changelog]
header = """# Changelog

本项目的所有重要变更都记录在此。格式参考 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [语义化版本](https://semver.org/lang/zh-CN/)。

本文件由 [git-cliff](https://git-cliff.org) 依据提交历史自动生成，请勿手工编辑。
英文版见 [CHANGELOG.en.md](CHANGELOG.en.md)。

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [未发布]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.scope %} ({{ commit.scope }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # 只改版本号或校验值的提交不进日志。
  { message = "^build: release", skip = true },
  { message = "^chore: fill the Homebrew sha256", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # 用户可见的变更。<!-- N --> 前缀只用于排序。
  { message = "^feat", group = "<!-- 0 -->新增" },
  { message = "^fix", group = "<!-- 1 -->修复" },
  { message = "^perf", group = "<!-- 2 -->变更" },
  { message = "^refactor", group = "<!-- 2 -->变更" },
  { message = "^docs", group = "<!-- 3 -->文档" },
  { message = "^revert", group = "<!-- 4 -->回退" },
  # 其余开发类提交不出现在面向用户的日志里。
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
]
