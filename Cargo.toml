[package]
name = "agent-status-indicator"
version = "0.2.9"
edition = "2021"
description = "Native cross-platform tray monitor for AI coding agents"
license = "MIT"
repository = "https://github.com/DuRunzhe/AgentStatusIndicator"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
dirs = "6"
fs2 = "0.4"
notify-rust = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tray-icon = "0.20"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "UI_Notifications", "Data_Xml_Dom"] }
