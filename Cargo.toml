[package]
name = "agent-status-indicator"
version = "0.2.9"
edition = "2021"
description = "Native cross-platform tray monitor for AI coding agents"
license = "MIT"
repository = "https://github.com/DuRunzhe/AgentStatusIndicator"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
dirs = "6"
notify-rust = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tray-icon = "0.20"
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
