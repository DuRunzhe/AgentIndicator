# git-cliff configuration (English): generates CHANGELOG.en.md from the same
# Conventional Commits and release tags as cliff.toml.
#
#   bash scripts/update-changelog.sh 0.2.31
#
# Keep the filters and grouping in sync with cliff.toml; only the header and the
# group titles are translated.

[changelog]
header = """# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project
adheres to [Semantic Versioning](https://semver.org/).

This file is generated from the commit history by
[git-cliff](https://git-cliff.org). Do not edit it by hand.
The Chinese edition is [CHANGELOG.md](CHANGELOG.md).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.scope %} ({{ commit.scope }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # Release-bookkeeping commits that only move the version or the checksum.
  { message = "^build: release", skip = true },
  { message = "^chore: fill the Homebrew sha256", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # User-visible changes. The <!-- N --> prefix only controls ordering.
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  # Remaining developer-only commits stay out of the user-facing log.
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
]
