name: release-extra

# Temporary helper: build the platforms missing from v0.2.11 (macOS x64,
# Linux x64, Windows x64) and attach them to the existing v0.2.11 release.
# Remove this file once the main release.yml matrix covers every target.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: agent-status-indicator-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agent-status-indicator-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agent-status-indicator-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "--remap-path-prefix $HOME=~"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev pkg-config libssl-dev
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive + sha256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.asset }}" = "agent-status-indicator-x86_64-pc-windows-msvc.zip" ]; then
            (cd "target/${{ matrix.target }}/release" \
              && tar -a -cf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" agent-status-indicator.exe)
          else
            tar -czf "dist/${{ matrix.asset }}" \
              -C "target/${{ matrix.target }}/release" agent-status-indicator
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          else
            sha256sum "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          fi
      - name: Attach to v0.2.11 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.11
          files: dist/*
