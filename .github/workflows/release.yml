name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: agent-status-indicator-aarch64-apple-darwin.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: agent-status-indicator-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agent-status-indicator-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agent-status-indicator-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      # Keep build-machine paths out of the published artifacts.
      RUSTFLAGS: "--remap-path-prefix $HOME=~"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev pkg-config libssl-dev
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive + sha256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.asset }}" = "agent-status-indicator-x86_64-pc-windows-msvc.zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/agent-status-indicator.exe' -DestinationPath 'dist/${{ matrix.asset }}' -Force"
          else
            tar -czf "dist/${{ matrix.asset }}" \
              -C "target/${{ matrix.target }}/release" agent-status-indicator
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          else
            sha256sum "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Assemble one cross-platform npm tarball from every build and publish it.
  # Only runs when an NPM_TOKEN secret is configured (automation token with
  # bypass-2FA; see npmjs.com -> Access Tokens).
  publish-npm:
    name: publish npm package
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble platform binaries under bin/<platform>-<arch>/
        shell: bash
        run: |
          set -euo pipefail
          for archive in artifacts/*; do
            case "$archive" in
              *aarch64-apple-darwin*)         dir="bin/darwin-arm64" ;;
              *x86_64-apple-darwin*)          dir="bin/darwin-x64" ;;
              *x86_64-unknown-linux-gnu*)     dir="bin/linux-x64" ;;
              *x86_64-pc-windows-msvc*)       dir="bin/win32-x64" ;;
              *) continue ;;
            esac
            mkdir -p "$dir"
            if [[ "$archive" == *.zip ]]; then
              unzip -o -j "$archive" -d "$dir"
            else
              tar -xzf "$archive" -C "$dir" || true
            fi
          done
          chmod +x bin/*/agent-status-indicator 2>/dev/null || true
          ls -R bin
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm publish ./dist/agent-status-indicator-*.tgz

  # Developer ID signing + notarization. Secrets never reach other jobs or any
  # pull-request trigger; they exist only in this tag-only job's environment
  # and are consumed inside an ephemeral keychain.
  #
  # Required repository secrets:
  #   ASI_CERT_P12       base64 of a Developer ID Application .p12 (with key)
  #   ASI_CERT_PASSWORD  password protecting that .p12
  #   ASI_NOTARY_KEY     base64 of the App Store Connect API .p8
  #   ASI_NOTARY_KEY_ID / ASI_NOTARY_ISSUER_ID for that .p8
  macos-notarize:
    name: notarize macOS arm64
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    env:
      CERT_P12: ${{ secrets.ASI_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.ASI_CERT_PASSWORD }}
      NOTARY_KEY: ${{ secrets.ASI_NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.ASI_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.ASI_NOTARY_ISSUER_ID }}
      TEAM_ID: W796BPAJVP
      SIGN_IDENTITY: "Developer ID Application: Runzhe Du (W796BPAJVP)"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release on the arm64 host
        run: cargo build --release
      - name: Import signing identity into an ephemeral keychain
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/asi-cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/asi-cert.p12 -k build.keychain -P "$CERT_PASSWORD"
          # Grants codesign and Apple notary tools keychain access without
          # trusting a notarytool path (it lives inside Xcode on runners).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm -f /tmp/asi-cert.p12
      - name: Stamp the bundle version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s|<string>0\.2\.[0-9]*</string>|<string>${VERSION}</string>|g" \
            scripts/package-macos-app.sh
      - name: Sign, notarize and staple the app
        env:
          ASI_SIGN_IDENTITY: ${{ env.SIGN_IDENTITY }}
          ASI_NOTARY_KEY: ${{ secrets.ASI_NOTARY_KEY }}
          ASI_NOTARY_KEY_ID: ${{ env.NOTARY_KEY_ID }}
          ASI_NOTARY_ISSUER_ID: ${{ env.NOTARY_ISSUER_ID }}
        run: |
          # Direct API-key credentials avoid keychain-profile ACL prompts on a
          # headless runner (those made notarytool hang waiting for UI input).
          echo "$ASI_NOTARY_KEY" | base64 --decode > /tmp/AuthKey.p8
          ASI_NOTARY_KEY_FILE=/tmp/AuthKey.p8 bash scripts/notarize-macos-app.sh
      - name: Sign the raw binary and overwrite the arm64 release asset
        run: |
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" \
            target/release/agent-status-indicator
          tar -czf agent-status-indicator-aarch64-apple-darwin.tar.gz \
            -C target/release agent-status-indicator
          shasum -a 256 agent-status-indicator-aarch64-apple-darwin.tar.gz \
            | awk '{print $1}' > agent-status-indicator-aarch64-apple-darwin.tar.gz.sha256
          gh release upload "$GITHUB_REF_NAME" \
            agent-status-indicator-aarch64-apple-darwin.tar.gz \
            agent-status-indicator-aarch64-apple-darwin.tar.gz.sha256 \
            --clobber

  # Note on macOS Developer ID signing + notarization:
  # run it locally before tagging until a hardened CI job is needed:
  #   bash scripts/build-release.sh
  #   ASI_SIGN_IDENTITY="Developer ID Application: ..." bash scripts/package-macos-app.sh
  #   ASI_TEAM_ID=... ASI_NOTARY_PROFILE=... bash scripts/notarize-macos-app.sh
  # then push the stapled app/ bundle in the same commit as the version bump.
