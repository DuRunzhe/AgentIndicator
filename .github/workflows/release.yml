name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: agent-status-indicator-aarch64-apple-darwin.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: agent-status-indicator-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agent-status-indicator-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agent-status-indicator-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    env:
      # Keep build-machine paths out of the published artifacts.
      RUSTFLAGS: "--remap-path-prefix $HOME=~"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev pkg-config libssl-dev
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive + sha256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.asset }}" = "agent-status-indicator-x86_64-pc-windows-msvc.zip" ]; then
            (cd "target/${{ matrix.target }}/release" \
              && tar -a -cf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" agent-status-indicator.exe)
          else
            tar -czf "dist/${{ matrix.asset }}" \
              -C "target/${{ matrix.target }}/release" agent-status-indicator
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          else
            sha256sum "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Assemble one cross-platform npm tarball from every build and publish it.
  # Only runs when an NPM_TOKEN secret is configured (automation token with
  # bypass-2FA; see npmjs.com -> Access Tokens).
  publish-npm:
    name: publish npm package
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble platform binaries under bin/<platform>-<arch>/
        shell: bash
        run: |
          set -euo pipefail
          for archive in artifacts/*; do
            case "$archive" in
              *aarch64-apple-darwin*)         dir="bin/darwin-arm64" ;;
              *x86_64-apple-darwin*)          dir="bin/darwin-x64" ;;
              *x86_64-unknown-linux-gnu*)     dir="bin/linux-x64" ;;
              *x86_64-pc-windows-msvc*)       dir="bin/win32-x64" ;;
              *) continue ;;
            esac
            mkdir -p "$dir"
            if [[ "$archive" == *.zip ]]; then
              unzip -o -j "$archive" -d "$dir"
            else
              tar -xzf "$archive" -C "$dir" || true
            fi
          done
          chmod +x bin/*/agent-status-indicator 2>/dev/null || true
          ls -R bin
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm publish ./dist/agent-status-indicator-*.tgz

  # Note on macOS Developer ID signing + notarization:
  # run it locally before tagging until a hardened CI job is needed:
  #   bash scripts/build-release.sh
  #   ASI_SIGN_IDENTITY="Developer ID Application: ..." bash scripts/package-macos-app.sh
  #   ASI_TEAM_ID=... ASI_NOTARY_PROFILE=... bash scripts/notarize-macos-app.sh
  # then push the stapled app/ bundle in the same commit as the version bump.
